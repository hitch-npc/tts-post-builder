<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Сверка сочетаний — посты TTS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%272%27 fill=%27%230D0D0D%27/%3E%3Cpath d=%27M16 10c6 0 11 6 11 6s-5 6-11 6S5 16 5 16s5-6 11-6Z%27 fill=%27%23D6D6D2%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%273%27 fill=%27%230D0D0D%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="ds/ds-smm.css">
<link rel="stylesheet" href="canvas-plus.css">
<link rel="stylesheet" href="styles.css">
<style>
  .rv { max-width: 1240px; margin: 0 auto; padding: 32px 20px 120px; }
  .rv-lead { color: var(--n300); font-size: 14px; line-height: 1.7; max-width: 720px; margin: 0 0 8px; }
  .rv-sec { margin-top: 48px; }
  .rv-sec > h2 { font-size: 11px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--n300); margin: 0 0 6px; }
  .rv-sec > p { color: var(--n500); font-size: 13px; margin: 0 0 20px; }
  .rv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 28px 20px; }
  .rv-card { display: flex; flex-direction: column; gap: 10px; }
  .rv-card .pv-crop { cursor: zoom-in; box-shadow: 0 12px 32px var(--shadow-color); }
  .rv-id { font-size: 10px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--n500); }
  .rv-name { font-size: 13px; color: var(--n200); line-height: 1.45; min-height: 38px; }
  .rv-btns { display: flex; gap: 6px; }
  .rv-btns .btn { flex: 1; min-height: 36px; padding: 0 8px; }
  .rv-btns .btn[aria-pressed="true"].rv-ok { background: var(--accent-ghost); border-color: var(--success); color: var(--n100); }
  .rv-btns .btn[aria-pressed="true"].rv-no { background: var(--accent-ghost); border-color: var(--error-fg); color: var(--n100); }
  .rv-card[data-v="no"] .pv-crop { opacity: .45; }
  .rv-bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap;
    padding: 12px 16px; background: var(--n950); border-top: 1px solid var(--n800); z-index: 5; }
  .rv-count { font-size: 12px; color: var(--n300); }
  .rv-box { position: fixed; inset: 0; background: var(--shadow-color); display: flex; align-items: center; justify-content: center; z-index: 9; cursor: zoom-out; }
  .rv-box[hidden] { display: none; }
</style>
</head>
<body>
<header class="app-head">
  <span class="logo" id="appLogo"></span>
  <h1>Сверка сочетаний</h1>
  <span class="spacer"></span>
  <a class="btn btn-ghost btn-sm" href="guide.html">Как не надо</a>
  <a class="btn btn-primary btn-sm" href="index.html">К конструктору</a>
</header>

<main class="rv">
  <p class="rv-lead">Сборки тем же движком, что и конструктор. У каждой — «Допустимо» или «Нет». По оценкам правила попадают в «Как не надо»,
    а недопустимые сочетания конструктор перестаёт предлагать. Нажатие на макет — крупно.</p>
  <div id="list"></div>
</main>

<div class="rv-bar">
  <span class="rv-count" id="count"></span>
  <button class="btn btn-primary btn-sm" type="button" id="copy">Скопировать оценки</button>
  <button class="btn btn-ghost btn-sm" type="button" id="clear">Сбросить оценки</button>
</div>
<div class="rv-box" id="box" hidden></div>
<div class="measure" id="measure" aria-hidden="true"></div>
<div class="toast" id="toast" role="status"></div>

<script src="js/logo.js"></script>
<script src="js/core.js"></script>
<script src="js/collage.js"></script>
<script src="js/bg.js"></script>
<script src="js/poster.js"></script>
<script src="js/review.js"></script>
</body>
</html>
